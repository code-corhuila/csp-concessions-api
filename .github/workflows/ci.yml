name: CI

# Every Pull Request builds the repository and runs its tests on a clean machine.
# "It works on my computer" is not evidence; a green check here is.

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The integration tests of the persistence adapter and of the product flow run against the real engine
    # (Annex C): TEST_DATABASE_URL below turns them on, and the schema comes from csp-concessions-db.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d csp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_DEPLOY_KEY: ${{ secrets.DB_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      # The schema is owned by csp-concessions-db (Norma 5.2.1): this repository only applies it.
      # DB_DEPLOY_KEY is the private half of a read-only deploy key of that repository; GITHUB_TOKEN cannot read another one.
      # Without it the build fails: a green run must mean the integration tests really ran.
      - name: Require the schema key
        if: env.DB_DEPLOY_KEY == ''
        run: |
          echo "::error::DB_DEPLOY_KEY is not set, so the PostgreSQL integration tests cannot run"
          exit 1
      # Pinned to a commit of csp-concessions-db until it publishes a release tag vX.Y.Z (numeral 11.5): a green
      # run tells which schema it tested, and a schema change there cannot break an unrelated Pull Request.
      # Move the pin on purpose, to the release tag when it exists.
      - uses: actions/checkout@v4
        with:
          repository: code-corhuila/csp-concessions-db
          ref: a7ff65e32c5bccc8b42fea220ad17bcee2feb21d
          path: csp-concessions-db
          ssh-key: ${{ secrets.DB_DEPLOY_KEY }}
      - name: Apply the concessions schema
        run: |
          echo "TEST_DATABASE_URL=jdbc:postgresql://localhost:5432/csp?user=postgres&password=postgres" >> "$GITHUB_ENV"

          # The login users exist before the migrations run: csp-infra-postgres creates them (Annex J.5.5).
          for login in concessions_app worker_app; do
            PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d csp -c "CREATE ROLE $login LOGIN PASSWORD 'ci-only'"
          done
          # One version sequence for the whole repository: the order is the number, not the folder.
          find csp-concessions-db/01_ddl csp-concessions-db/02_dml csp-concessions-db/03_dcl csp-concessions-db/04_tcl -name 'V*.sql' | awk -F/ '{print $NF" "$0}' | sort | cut -d' ' -f2 |
            while read -r migration; do
              echo "applying $migration"
              PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d csp -f "$migration"
            done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
